<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>PixieDuster - AI Persona Cloning</title>
    <!-- Stlite CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Stlite JS -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.75.0/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["requests", "python-dotenv"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            },
            "logo.png": {
                url: "./logo.png",
            }
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
