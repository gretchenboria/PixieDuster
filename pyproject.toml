[project]
name = "pixieduster"
version = "0.1.0"
description = "Clone a writing voice from a git repo into an AI persona prompt, from the terminal."
readme = "README-cli.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gretchenboria", email = "me@gretchenboria.com" }]
keywords = ["llm", "persona", "prompt", "cli", "tui", "gemini", "agents"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.32", "fpdf2>=2.7.9"]
dev = ["pytest>=8.0"]

[project.scripts]
pixieduster = "pixieduster.cli:app"
pxd = "pixieduster.cli:app"

[project.urls]
Homepage = "https://github.com/gretchenboria/PersonaPromptGenerator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pixieduster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
