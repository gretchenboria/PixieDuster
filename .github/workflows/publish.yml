# Publish to PyPI when a version tag is pushed.
#
# Uses PyPI Trusted Publishing: PyPI verifies this workflow's identity through
# GitHub's OIDC, so there is no API token to store, leak, or rotate. Configure
# it once at https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : pixieduster
#   Owner             : gretchenboria
#   Repository name   : PixieDuster
#   Workflow name     : publish.yml
#   Environment name  : pypi
#
# Then release with:  git tag v0.1.0 && git push origin v0.1.0

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
